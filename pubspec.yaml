name: cut_clinic_app
description: CUT Clinic Appointment Management System - student mobile app (Flutter / Supabase).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  intl: ">=0.19.0 <1.0.0"
  image_picker: ^1.1.2
  file_picker: ">=8.1.0 <11.0.0"
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/